<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="470" viewBox="0 0 1200 470"
     role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">How the proof works</title>
  <desc id="workflow-desc">Synthetic data with injected typologies feeds four explainable detectors; a role-aware evaluator checks precision and recall against fixed floors; GitHub Actions blocks any push or PR that regresses below those floors.</desc>

  <rect width="1200" height="470" rx="26" fill="#0B0D10"/>

  <text x="56" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#7C8791">HOW THE PROOF WORKS</text>
  <text x="56" y="90" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#F3F1EA">Scored against ground truth on every push.</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">

    <g transform="translate(56 134)">
      <rect width="260" height="168" rx="14" fill="#12181D" stroke="#2B333A"/>
      <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1" fill="#7C8791">STEP 1</text>
      <text x="20" y="54" font-size="19" font-weight="700" fill="#F3F1EA">Synthetic data +</text>
      <text x="20" y="76" font-size="19" font-weight="700" fill="#F3F1EA">ground truth</text>
      <rect x="20" y="86" width="190" height="10" rx="3" fill="#33474F"/>
      <rect x="20" y="102" width="150" height="10" rx="3" fill="#2A3A40"/>
      <rect x="20" y="118" width="168" height="10" rx="3" fill="#2A3A40"/>
      <text x="20" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#7C8791">customers &#183; transactions &#183; labels</text>
    </g>

    <path d="M330,210 L342,218 L330,226" stroke="#55707A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(332 134)">
      <rect width="260" height="168" rx="14" fill="#12181D" stroke="#2B333A"/>
      <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1" fill="#7C8791">STEP 2</text>
      <text x="20" y="54" font-size="19" font-weight="700" fill="#F3F1EA">4 explainable</text>
      <text x="20" y="76" font-size="19" font-weight="700" fill="#F3F1EA">detectors</text>
      <g stroke="#55707A" stroke-width="1" fill="none">
        <rect x="20" y="84" width="100" height="20" rx="6"/>
        <rect x="128" y="84" width="100" height="20" rx="6"/>
        <rect x="20" y="108" width="100" height="20" rx="6"/>
        <rect x="128" y="108" width="100" height="20" rx="6"/>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#9AA3AB" text-anchor="middle">
        <text x="70" y="97">STRUCTURING</text>
        <text x="178" y="97">FAN_IN_OUT</text>
        <text x="70" y="121">PASS_THROUGH</text>
        <text x="178" y="121">RINGS</text>
      </g>
      <text x="20" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#7C8791">score 60&#8211;100 &#183; not a probability</text>
    </g>

    <path d="M606,210 L618,218 L606,226" stroke="#55707A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(608 134)">
      <rect width="260" height="168" rx="14" fill="#12181D" stroke="#2B333A"/>
      <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1" fill="#7C8791">STEP 3</text>
      <text x="20" y="54" font-size="19" font-weight="700" fill="#F3F1EA">Role-aware</text>
      <text x="20" y="76" font-size="19" font-weight="700" fill="#F3F1EA">evaluation</text>
      <line x1="14" y1="100" x2="150" y2="100" stroke="#55707A" stroke-width="1" stroke-dasharray="4 3"/>
      <rect x="20" y="110" width="14" height="18" fill="#33474F"/>
      <rect x="50" y="90" width="14" height="38" fill="#D97A1F"/>
      <rect x="80" y="104" width="14" height="24" fill="#33474F"/>
      <text x="154" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#9AA3AB">FLOOR</text>
      <text x="20" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#7C8791">precision &amp; recall vs. floor</text>
    </g>

    <path d="M882,210 L894,218 L882,226" stroke="#55707A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(884 134)">
      <rect width="260" height="168" rx="14" fill="#12181D" stroke="#2B333A"/>
      <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1" fill="#7C8791">STEP 4</text>
      <text x="20" y="54" font-size="19" font-weight="700" fill="#F3F1EA">CI blocks</text>
      <text x="20" y="76" font-size="19" font-weight="700" fill="#F3F1EA">regressions</text>
      <circle cx="45" cy="104" r="24" fill="none" stroke="#F3F1EA" stroke-width="2"/>
      <path d="M33,104 L42,113 L58,92" stroke="#F3F1EA" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1" fill="#D97A1F">BLOCKING</text>
      <text x="90" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7C8791">on regression</text>
      <text x="20" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#7C8791">push &amp; PR &#183; GitHub Actions</text>
    </g>

    <g transform="translate(56 332)">
      <rect width="348" height="76" rx="12" fill="#12181D" stroke="#2B333A"/>
      <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1" fill="#D97A1F">STRUCTURING</text>
      <text x="20" y="58" font-size="20" fill="#F3F1EA">P &#8805; 0.80 &#160;&#183;&#160; R &#8805; 0.80</text>
    </g>
    <g transform="translate(426 332)">
      <rect width="348" height="76" rx="12" fill="#12181D" stroke="#2B333A"/>
      <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1" fill="#D97A1F">FAN_IN / OUT</text>
      <text x="20" y="58" font-size="20" fill="#F3F1EA">P &#8805; 0.80 &#160;&#183;&#160; R &#8805; 0.80</text>
    </g>
    <g transform="translate(796 332)">
      <rect width="348" height="76" rx="12" fill="#12181D" stroke="#2B333A"/>
      <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1" fill="#D97A1F">PASS_THROUGH</text>
      <text x="20" y="58" font-size="20" fill="#F3F1EA">P &#8805; 0.75 &#160;&#183;&#160; R &#8805; 0.75</text>
    </g>

    <text x="56" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7C8791">community_ring is measured but non-blocking while known stability limits are addressed &#8212; see evaluation/README.md</text>
  </g>
</svg>
