<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">fincrime-llm-toolkit</title>
  <desc id="hero-desc">A Claude-first practitioner toolkit for AML/CTF transaction monitoring and KYC/EDD, illustrated with a fan-in/fan-out transaction graph flagged by the structuring detector.</desc>

  <rect width="1200" height="360" rx="26" fill="#0B0D10"/>

  <g id="title-block" transform="translate(56 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="-4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#7C8791">AML / CTF &#183; CLAUDE-FIRST PRACTITIONER TOOLKIT</text>

    <text x="0" y="56" font-size="46" font-weight="700" letter-spacing="-0.5" fill="#F3F1EA">fincrime-llm-toolkit</text>

    <text x="0" y="100" font-size="21" fill="#B7BEC4">Project instructions, Claude Code skills, and</text>
    <text x="0" y="128" font-size="21" fill="#B7BEC4">detection pipelines for transaction monitoring</text>
    <text x="0" y="156" font-size="21" fill="#B7BEC4">and KYC/EDD &#8212; run against synthetic data.</text>

    <line x1="0" y1="182" x2="600" y2="182" stroke="#3A434B" stroke-width="1"/>

    <text x="0" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7C8791">MIT LICENSE &#160;&#183;&#160; EU / SE GROUNDING &#160;&#183;&#160; ZERO REAL CUSTOMER DATA</text>
  </g>

  <g id="project-proof" transform="translate(700 48)">
    <text x="0" y="-10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1" fill="#7C8791">ILLUSTRATIVE DETECTOR OUTPUT</text>

    <g stroke="#55707A" stroke-width="1.5" fill="none" opacity="0.55">
      <path d="M10,10 Q120,40 200,106"/>
      <path d="M10,74 Q120,80 200,106"/>
      <path d="M10,138 Q120,130 200,106"/>
      <path d="M10,202 Q120,170 200,106"/>
      <path d="M200,106 Q300,70 400,60"/>
      <path d="M200,106 Q300,150 400,160"/>
    </g>

    <g fill="#16202A" stroke="#55707A" stroke-width="1.5">
      <circle cx="10" cy="10" r="7"/>
      <circle cx="10" cy="74" r="7"/>
      <circle cx="10" cy="138" r="7"/>
      <circle cx="10" cy="202" r="7"/>
      <circle cx="400" cy="60" r="8"/>
      <circle cx="400" cy="160" r="8"/>
    </g>

    <circle cx="200" cy="106" r="11" fill="#D97A1F" stroke="#F3F1EA" stroke-width="1.5"/>

    <rect x="150" y="20" width="148" height="32" rx="8" fill="#0B0D10" stroke="#D97A1F" stroke-width="1.5"/>
    <text x="224" y="41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#F3B579">FAN_IN_OUT &#183; 91</text>
    <path d="M222,52 L204,97" stroke="#D97A1F" stroke-width="1.5" opacity="0.85" fill="none"/>

    <text x="0" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7C8791">synthetic entities &#183; illustrative pattern</text>
  </g>
</svg>
